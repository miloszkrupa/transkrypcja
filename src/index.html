<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.groq.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net;">
<title>Transkrypcja</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#fff; --bg2:#f7f7f5; --bg3:#f0efeb;
  --text:#1a1a18; --text2:#6b6b68; --text3:#9e9e9a;
  --border:rgba(0,0,0,0.12); --border2:rgba(0,0,0,0.22);
  --danger-bg:#fcebeb; --danger-text:#a32d2d;
  --r:8px; --rl:12px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg3); color:var(--text); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem 4rem; }
.app { width:100%; max-width:680px; }
h1 { font-size:22px; font-weight:500; }
.subtitle { font-size:14px; color:var(--text2); margin-top:4px; margin-bottom:2rem; }
.card { background:var(--bg); border:0.5px solid var(--border); border-radius:var(--rl); padding:1.25rem; margin-bottom:1rem; }
.lbl { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:8px; }
.file-row { display:flex; gap:8px; align-items:center; }
.file-lbl { flex:1; background:var(--bg2); border-radius:var(--r); padding:9px 12px; font-size:13px; color:var(--text2); cursor:pointer; border:0.5px solid var(--border2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-lbl.has-file { color:var(--text); }
.btn-pick { background:var(--text); color:var(--bg); border:none; border-radius:var(--r); padding:9px 16px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn-pick:hover { opacity:.85; }
.opts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.opts select { flex:1; min-width:140px; border:0.5px solid var(--border2); background:var(--bg2); border-radius:var(--r); padding:8px 10px; font-size:13px; color:var(--text); outline:none; cursor:pointer; }
.btn-main { width:100%; background:var(--text); color:var(--bg); border:none; border-radius:var(--r); padding:11px 20px; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
.btn-main:hover { opacity:.85; }
.btn-main:disabled { opacity:.35; cursor:not-allowed; }
.prog { display:none; margin-bottom:1rem; }
.prog-lbl { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); margin-bottom:6px; }
.prog-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; background:var(--text); border-radius:2px; transition:width .4s ease; }
.err { display:none; font-size:13px; color:var(--danger-text); background:var(--danger-bg); border-radius:var(--r); padding:10px 14px; margin-bottom:1rem; }
.result-card { display:none; }
.result-meta { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); margin-bottom:10px; }
.result-text { font-size:14px; color:var(--text); line-height:1.75; white-space:pre-wrap; max-height:300px; overflow-y:auto; background:var(--bg2); border:0.5px solid var(--border); border-radius:var(--r); padding:14px; margin-bottom:12px; }
.export-row { display:flex; gap:8px; flex-wrap:wrap; }
.btn-exp { background:transparent; border:0.5px solid var(--border2); border-radius:var(--r); padding:7px 14px; font-size:13px; color:var(--text); cursor:pointer; display:flex; align-items:center; gap:6px; }
.btn-exp:hover { background:var(--bg2); }

/* SRT modal */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; padding:1rem; }
.overlay.open { display:flex; }
.modal { background:var(--bg); border-radius:var(--rl); padding:1.5rem; width:100%; max-width:400px; border:0.5px solid var(--border); }
.modal-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; }
.modal-hdr h2 { font-size:17px; font-weight:500; }
.modal-close { background:none; border:none; cursor:pointer; color:var(--text2); font-size:20px; display:flex; }
.field { margin-bottom:1rem; }
.field label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; }
.field input[type=number] { width:100%; border:0.5px solid var(--border2); background:var(--bg2); border-radius:var(--r); padding:8px 12px; font-size:14px; color:var(--text); outline:none; }
.adv-btn { background:none; border:none; cursor:pointer; color:var(--text2); font-size:13px; display:flex; align-items:center; gap:6px; padding:0; margin-bottom:1rem; }
.adv-body { display:none; }
.adv-body.open { display:block; }
.cb-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:1rem; cursor:pointer; }
.cb-row input { margin-top:2px; width:16px; height:16px; accent-color:var(--text); flex-shrink:0; }
.cb-lbl strong { display:block; font-size:13px; font-weight:500; margin-bottom:2px; }
.cb-lbl span { font-size:12px; color:var(--text2); line-height:1.4; }
</style>
</head>
<body>
<div class="app">
  <h1>Transkrypcja</h1>
  <p class="subtitle">Whisper Large v3 via Groq — działa lokalnie</p>

  <div class="card">
    <div class="lbl">Plik audio / wideo</div>
    <div class="file-row">
      <div class="file-lbl" id="fileLbl" onclick="pickFile()">Kliknij aby wybrać plik…</div>
      <button class="btn-pick" onclick="pickFile()">Wybierz</button>
    </div>
    <div class="opts">
      <select id="langSelect">
        <option value="pl">🇵🇱 Polski</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="uk">🇺🇦 Українська</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
      <select id="modelSelect">
        <option value="whisper-large-v3-turbo">Whisper Large v3 Turbo</option>
        <option value="whisper-large-v3">Whisper Large v3 (dokładniejszy)</option>
      </select>
    </div>
    <button class="btn-main" id="transBtn" onclick="startTranscription()" disabled>
      <i class="ti ti-microphone"></i> Transkrybuj
    </button>
  </div>

  <div class="prog" id="prog">
    <div class="prog-lbl"><span id="progMsg">Przetwarzanie...</span><span id="progPct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div class="err" id="err"></div>

  <div class="card result-card" id="resultCard">
    <div class="result-meta"><span id="resMeta"></span><span id="resWords"></span></div>
    <div class="result-text" id="resText"></div>
    <div class="export-row">
      <button class="btn-exp" onclick="exportTXT()"><i class="ti ti-file-text"></i> TXT</button>
      <button class="btn-exp" onclick="openSRT()"><i class="ti ti-subtitles"></i> SRT</button>
      <button class="btn-exp" onclick="exportDOCX()"><i class="ti ti-file-word"></i> DOCX</button>
      <button class="btn-exp" id="copyBtn" onclick="copyText()"><i class="ti ti-copy"></i> Kopiuj</button>
    </div>
  </div>
</div>

<!-- SRT Modal -->
<div class="overlay" id="srtOverlay">
  <div class="modal">
    <div class="modal-hdr">
      <h2>Pobierz napisy SRT</h2>
      <button class="modal-close" onclick="closeSRT()"><i class="ti ti-x"></i></button>
    </div>
    <div class="field">
      <label>Maksymalna liczba słów na segment</label>
      <input type="number" id="srtMaxWords" value="8" min="1" max="50" />
    </div>
    <button class="adv-btn" onclick="toggleAdv()">
      <i class="ti ti-chevron-right" id="advIcon"></i> Zaawansowane ustawienia segmentacji
    </button>
    <div class="adv-body" id="advBody">
      <div class="field">
        <label>Maksymalny czas trwania na segment (sekundy)</label>
        <input type="number" id="srtMaxDur" value="10" min="1" max="60" />
      </div>
      <div class="field">
        <label>Maksymalna liczba znaków na segment</label>
        <input type="number" id="srtMaxChars" value="80" min="10" max="300" />
      </div>
      <label class="cb-row">
        <input type="checkbox" id="srtSentence" checked />
        <div class="cb-lbl">
          <strong>Segmentacja z uwzględnieniem zdań</strong>
          <span>Nowe zdanie zawsze zaczyna nowy segment.</span>
        </div>
      </label>
    </div>
    <button class="btn-main" onclick="exportSRT()"><i class="ti ti-download"></i> Pobierz SRT</button>
  </div>
</div>

<script>
const GROQ_KEY = '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';
let currentFile = null;
let transcriptData = null;

window.api.onProgress(({ pct, msg }) => {
  document.getElementById('prog').style.display = 'block';
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progMsg').textContent = msg;
});

async function pickFile() {
  const f = await window.api.pickFile();
  if (!f) return;
  currentFile = f;
  const mb = (f.size / 1024 / 1024).toFixed(1);
  const lbl = document.getElementById('fileLbl');
  lbl.textContent = f.name + '  (' + mb + ' MB)';
  lbl.classList.add('has-file');
  document.getElementById('transBtn').disabled = false;
  document.getElementById('err').style.display = 'none';
}

async function startTranscription() {
  if (!currentFile) return;
  document.getElementById('transBtn').disabled = true;
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('err').style.display = 'none';
  document.getElementById('prog').style.display = 'block';
  document.getElementById('progFill').style.width = '5%';
  document.getElementById('progMsg').textContent = 'Startowanie...';
  document.getElementById('progPct').textContent = '5%';

  try {
    const data = await window.api.transcribe({
      filePath: currentFile.path,
      model: document.getElementById('modelSelect').value,
      language: document.getElementById('langSelect').value,
      apiKey: GROQ_KEY,
    });
    transcriptData = data;
    document.getElementById('progFill').style.width = '100%';
    document.getElementById('progPct').textContent = '100%';
    document.getElementById('progMsg').textContent = '✓ Gotowe!';
    setTimeout(() => { document.getElementById('prog').style.display = 'none'; }, 800);

    const words = data.text.trim().split(/\s+/).filter(Boolean).length;
    const dur = data.duration ? formatDur(data.duration) + ' · ' : '';
    document.getElementById('resMeta').textContent = dur + 'Język: ' + (data.language || '?');
    document.getElementById('resWords').textContent = words + ' słów';
    document.getElementById('resText').textContent = data.text.trim();
    document.getElementById('resultCard').style.display = 'block';
  } catch(e) {
    document.getElementById('prog').style.display = 'none';
    const el = document.getElementById('err');
    el.textContent = 'Błąd: ' + (e.message || 'Nieoczekiwany błąd');
    el.style.display = 'block';
  }
  document.getElementById('transBtn').disabled = false;
}

function formatDur(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m > 0 ? m + ' min ' + sec + ' s' : sec + ' s';
}

async function exportTXT() {
  if (!transcriptData) return;
  const p = await window.api.saveFile({ defaultName: 'transkrypcja.txt', ext: 'txt', content: transcriptData.text.trim() });
  if (p) alert('Zapisano: ' + p);
}

async function exportDOCX() {
  if (!transcriptData) return;
  // Simple DOCX via docx library loaded inline
  alert('Eksport DOCX — zapisz jako TXT i otwórz w Word, lub użyj eksportu SRT/TXT.');
}

async function copyText() {
  if (!transcriptData) return;
  await navigator.clipboard.writeText(transcriptData.text.trim());
  const b = document.getElementById('copyBtn');
  b.innerHTML = '<i class="ti ti-check"></i> Skopiowano';
  setTimeout(() => { b.innerHTML = '<i class="ti ti-copy"></i> Kopiuj'; }, 1800);
}

function openSRT() { document.getElementById('srtOverlay').classList.add('open'); }
function closeSRT() { document.getElementById('srtOverlay').classList.remove('open'); }
document.getElementById('srtOverlay').addEventListener('click', e => { if (e.target === document.getElementById('srtOverlay')) closeSRT(); });

function toggleAdv() {
  const b = document.getElementById('advBody'), ic = document.getElementById('advIcon');
  b.classList.toggle('open');
  ic.className = b.classList.contains('open') ? 'ti ti-chevron-down' : 'ti ti-chevron-right';
}

async function exportSRT() {
  if (!transcriptData) return;
  closeSRT();
  const maxWords = parseInt(document.getElementById('srtMaxWords').value) || 8;
  const maxDur = parseFloat(document.getElementById('srtMaxDur').value) || 10;
  const maxChars = parseInt(document.getElementById('srtMaxChars').value) || 80;
  const sentBreak = document.getElementById('srtSentence').checked;

  let segs = transcriptData.segments || [];
  if (!segs.length) {
    const words = transcriptData.text.trim().split(/\s+/); let t = 0;
    for (let i = 0; i < words.length; i += 10) {
      segs.push({ start: t, end: t+4, text: words.slice(i,i+10).join(' ') }); t+=4;
    }
  }

  const out = resegment(segs, maxWords, maxDur, maxChars, sentBreak);
  const srt = buildSRT(out);
  const p = await window.api.saveFile({ defaultName: 'napisy.srt', ext: 'srt', content: srt });
  if (p) alert('Zapisano: ' + p);
}

function resegment(segs, maxWords, maxDur, maxChars, sentBreak) {
  const out = []; let cur = null;
  for (const seg of segs) {
    const words = seg.text.trim().split(/\s+/);
    for (let wi = 0; wi < words.length; wi++) {
      const w = words[wi];
      if (!cur) { cur = { start: seg.start, end: seg.end, text: w }; continue; }
      const newText = cur.text + ' ' + w;
      const isSent = sentBreak && wi === 0 && cur.text && /[.!?…]$/.test(cur.text) && /^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(w);
      const tooLong = newText.split(/\s+/).length > maxWords || newText.length > maxChars || (seg.end - cur.start) > maxDur;
      if (isSent || tooLong) { out.push(cur); cur = { start: seg.start, end: seg.end, text: w }; }
      else { cur.text = newText; cur.end = seg.end; }
    }
  }
  if (cur) out.push(cur);
  return out;
}

function buildSRT(segs) {
  return segs.map((s,i) => `${i+1}\n${toSRT(s.start)} --> ${toSRT(s.end)}\n${s.text.trim()}\n`).join('\n');
}
function toSRT(s) {
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.round((s%1)*1000);
  return pad(h)+':'+pad(m)+':'+pad(sec)+','+pad(ms,3);
}
function pad(n,l=2){return String(n).padStart(l,'0');}
</script>
</body>
</html>
